# CPU debug TAP on Dock J23. Supply the external adapter's own config first.
# This is not the FPGA configuration TAP on the board USB connector.
transport select jtag
adapter speed 100
reset_config none
jtag newtap ae350 cpu -irlen 5 -expected-id 0x1000563d
target create ae350.cpu riscv -chain-position ae350.cpu
# CPU ID verified via D2XX on 2026-10-17; OpenOCD USB backend remains unqualified.
