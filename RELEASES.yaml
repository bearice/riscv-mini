# System bundles: board-qualified combinations of component versions.
#
# A bundle is what gets tested on hardware and packaged as a release, not any
# single component. Each entry pins the exact version of every component that
# was qualified together. Component versions live in VERSIONS.yaml; a bundle
# only records which of those versions were verified as one system.
#
# A bundle pins all six component versions, but the release package only builds
# and board-checks part of that set. `external` names the components that are
# declared compatible yet NOT built or verified by this package — they are built
# and verified by their own flows (e.g. uboot_verify.py) and are not shipped in
# the package. Omit `external` when the package covers every component.
#
# Example:
#   0.7.2:
#     components:
#       rtl: 0.7.1
#       bootloader: 0.7.1
#       hal: 0.7.1
#       bios: 0.7.2
#       opensbi: 0.7.1
#       uboot: 0.1.0
#     external: [opensbi, uboot]
